plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.mozhimen.netk"
    compileSdk 35

    defaultConfig {
        minSdk 19
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
//        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
//            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures{
        buildConfig = true
    }
}

dependencies {
    implementation 'com.github.mozhimen.KUtilKit:android:0.0.3'
    implementation 'com.github.mozhimen.ASerialKit:json-gson:0.0.2'
    implementation 'com.github.mozhimen.ATaskKit:executor:0.0.1'
    implementation 'com.github.mozhimen.ALibKit_Squareup:okhttp3:0.0.1'
    implementation 'com.github.mozhimen.ALibKit_Squareup:retrofit2:0.0.1'
    implementation 'com.github.mozhimen.ALibKit_Squareup:retrofit2-adapter_rxjava2:0.0.1'
    implementation 'com.github.mozhimen.ALibKit_Squareup:retrofit2-converter_gson:0.0.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}